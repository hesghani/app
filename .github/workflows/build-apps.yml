# Builds installable apps in Expo's cloud. Run it from the Actions tab (works from a phone).
# Needs one repository secret, EXPO_TOKEN, from https://expo.dev/settings/access-tokens
name: Build apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: preview = installable test build, production = store build
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Link the Expo project
        run: eas init --non-interactive --force
      - name: Start the build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
