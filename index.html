<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ihsan</title>
    <meta name="description" content="Prayer times, deep focus between prayers, dhikr, and a sixty-second nightly review. Everything stays on your device.">
    <meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0A0D14" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ihsan">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Geist:wght@300..700&family=Geist+Mono:wght@300..500&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <nav id="tabs" class="tabs" aria-label="Sections" hidden></nav>
    <dialog id="sheet" class="sheet"><div class="sheet-body"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="splash" class="splash" aria-hidden="true" hidden></div>
    <noscript>Ihsan needs JavaScript to calculate prayer times on your device.</noscript>
  </body>
</html>
